<!-- Diseño de Arte: cabecera con el logo "Brigade x Loco", cinco apartados abajo
     (Saldu, Agenda, Stocka, Finantzak y Gehiago; propuesta pendiente de validar por Arte). Colores del disco "Bide baten esanahia". -->

<header class="top">
  <div class="top-inner">
    <img class="logo" src="img/logo-cabecera.png" alt="Brigade x Loco">
    <div class="top-meta">
      <button class="concert-chip" id="concertChip" type="button" data-act="go" data-tab="agenda"></button>
      <span class="sync" id="sync" role="status" aria-live="polite"></span>
    </div>
  </div>
</header>

<main id="main" class="wrap"></main>

<div class="cartbar" id="cartbar" hidden></div>

<nav class="tabbar" aria-label="Atalak">
  <button type="button" data-act="go" data-tab="sales" id="tab-sales">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18l-2 11H5L3 6Zm4 14a1.5 1.5 0 1 0 0 .01M17 20a1.5 1.5 0 1 0 0 .01M3 6 2 3"/></svg>
    <span data-t="tab.sales"></span>
  </button>
  <button type="button" data-act="go" data-tab="agenda" id="tab-agenda">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4V6Zm0 4h16M8 3v5M16 3v5M8 14h2M14 14h2M8 17h2"/></svg>
    <span data-t="tab.agenda"></span>
  </button>
  <button type="button" data-act="go" data-tab="stock" id="tab-stock">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8Zm0 0 9 5 9-5M12 13v8"/></svg>
    <span data-t="tab.stock"></span>
  </button>
  <button type="button" data-act="go" data-tab="finance" id="tab-finance">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span data-t="tab.finance"></span>
  </button>
  <button type="button" data-act="go" data-tab="more" id="tab-more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    <span data-t="tab.more"></span>
  </button>
</nav>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="csvInput" accept=".csv,text/csv,text/plain" hidden>
